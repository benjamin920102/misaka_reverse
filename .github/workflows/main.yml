name: Repackage JAR to UTF-8 ZIP (prerelease)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag 名稱 (例如 v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JAR with UTF-8 filenames
        run: |
          mkdir -p jarlayer
          unzip -O utf-8 misaka-1.21.4-0.7.1_crk.jar -d jarlayer

      - name: Re-zip as UTF-8 ZIP
        run: |
          ZIP_NAME="misaka-1.21.4-0.7.1_crk-repacked.zip"
          cd jarlayer
          zip -r -q "../$ZIP_NAME" .
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create Prerelease and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Prerelease - ${{ inputs.tag_name }}
          body: |
            自動重新打包的 ZIP，內含已正規化的 UTF-8 檔名。
          draft: false
          prerelease: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
