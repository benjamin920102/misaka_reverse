# .github/workflows/repack-jar.yml
name: Repackage JAR → UTF‑8 ZIP (prerelease)

on:
  # 手動 Dispatch
  workflow_dispatch:

# 賦予寫入權限以建立 Release 與上傳檔案
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (optional, only if you need java for jar handling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract JAR with UTF‑8 filenames
        run: |
          mkdir jarlayer
          # -O utf-8 會把 zip 內的檔名自動轉成 UTF‑8
          unzip -O utf-8 misaka-1.21.4-0.7.1_crk.jar -d jarlayer

      - name: Re‑zip as UTF‑8 ZIP
        run: |
          ZIP_NAME="misaka-1.21.4-0.7.1_crk-repacked.zip"
          cd jarlayer
          zip -r -q "../$ZIP_NAME" .
          cd ..
          echo "ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create Prerelease
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}          # 使用現在的 tag 或分支名
          name: Prerelease - ${{ github.ref_name }}
          body: |
            自動重新打包的 ZIP，內含已正規化的 UTF‑8 檔名。
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to Prerelease
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ZIP }}
          asset_name: ${{ env.ZIP }}
          asset_content_type: application/zip
